# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: ninety-indexer
description: Envio HyperIndex for Ninety -- agent leaderboard, vault stats, and bet history
networks:
  - id: 10143 # Monad testnet
    start_block: 66448317 # Deploy.s.sol's deploy block, see ../deployments/10143.json
    contracts:
      - name: AgentRegistry
        address: "0xdbE23698776e12A7e1bf5FFBe5054d6919BcA8df"
        handler: src/EventHandlers.ts
        events:
          - event: "AgentRegistered(uint32 indexed agentId, address indexed operator, address vault, address quoteSigner, bytes32 strategyCommit, string metadataURI)"
          - event: "QuoteSignerUpdated(uint32 indexed agentId, address oldSigner, address newSigner)"
          - event: "StrategyUpdated(uint32 indexed agentId, bytes32 oldCommit, bytes32 newCommit, bytes blob)"
          - event: "AgentEnabledSet(uint32 indexed agentId, bool enabled)"
          - event: "MetadataUpdated(uint32 indexed agentId, string metadataURI)"
      - name: AgentVault
        # No address: one AgentVault is deployed per agent, at register() time -- discovered
        # dynamically from AgentRegistry's AgentRegistered event, not known up front. See
        # AgentRegistry.AgentRegistered's contractRegister handler in src/EventHandlers.ts.
        handler: src/EventHandlers.ts
        events:
          - event: "LiabilityLocked(uint256 indexed marketId, uint256 indexed betId, uint256 liability, uint256 lockedTotal)"
          - event: "LiabilitySettled(uint256 indexed marketId, uint256 indexed betId, uint256 liability, int256 pnl, uint256 lockedTotal)"
          - event: "PerformanceFeeAccrued(address indexed operator, uint256 feeShares, uint256 feeAssets, uint256 newHighWaterMark)"
          - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
          - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
          - event: "Transfer(address indexed from, address indexed to, uint256 value)"
      - name: MarketManager
        address: "0x7CB80d9De72273db78e013Fdb2180023A9152b88"
        handler: src/EventHandlers.ts
        events:
          - event: "MatchCreated(uint64 indexed matchId, bytes32 sourceRef, uint64 kickoffTs, string metadataURI)"
          - event: "MarketOpened(uint256 indexed marketId, uint64 indexed matchId, bytes32 indexed templateId, uint32 windowStart, uint32 windowEnd, uint64 closesAt, uint16 teamFilter)"
          - event: "MarketSuspended(uint256 indexed marketId, bytes32 reason)"
          - event: "MarketResumed(uint256 indexed marketId)"
          - event: "MarketClosed(uint256 indexed marketId)"
          - event: "MarketResolved(uint256 indexed marketId, uint8 outcome, uint64 qualifyingEventTs)"
          - event: "MarketVoided(uint256 indexed marketId, bytes32 reason)"
      - name: BetRouter
        address: "0xd368165544A427d1d42FCF53846fA84c37cBB387"
        handler: src/EventHandlers.ts
        events:
          - event: "BetPlaced(uint256 indexed betId, uint256 indexed marketId, address indexed bettor, uint256 groupId, uint32 agentId, uint8 side, uint16 probBps, uint128 stake, uint128 payout)"
          - event: "BetSettled(uint256 indexed betId, uint256 indexed marketId, uint8 status, uint128 amountOwed)"
          - event: "BetVoidedBySniperRule(uint256 indexed betId, uint256 indexed marketId, uint64 placedAt, uint64 qualifyingEventTs)"
          - event: "BetClaimed(uint256 indexed betId, address indexed bettor, uint128 amount)"
      - name: AgentMemory
        address: "0xB07D8e5B822F0d885BcDEebE3Dceb2166FF5D85c"
        handler: src/EventHandlers.ts
        events:
          - event: "MemorySaved(uint32 indexed agentId, uint64 indexed version, bytes32 commit, bytes blob)"
      - name: OddsLock
        address: "0xee2F9187af4266190C0F44CDbf8BA67650A2b072"
        handler: src/EventHandlers.ts
        events:
          - event: "LockBought(uint256 indexed lockId, uint256 indexed marketId, address indexed fan, uint32 agentId, uint8 side, uint16 probBps, uint128 stake, uint128 fee, uint64 heldUntil)"
# Ninety opens/settles markets and bets in strict, meaningful order (a bet's state depends on the
# market it belongs to), so ordered indexing is required -- unordered_multichain_mode is not set.
address_format: lowercase
